[package]
name = "mhserver-client"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
api = { path = "./api/gen" }
reqwest = { version = "0.13.1", features = ["json", "rustls", "stream"] }
slint = "1.15.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync"] }
serde = "1.0.228"
toml = "0.9.11"
uuid = "1.23.1"
system-interface = "0.27.3"
rfd = "0.17.2"
semver = "1.0.28"
futures-util = "0.3.33"
reqwest-middleware = "0.5.2"
http = "1.5.0"
async-trait = "0.1.91"

[build-dependencies]
slint-build = "1.15.1"
winresource = "0.1.31"
