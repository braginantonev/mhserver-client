[package]
name = "mhserver-client"
version = "1.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
slint = "1.15.1"
tokio = { version = "1.49.0", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7.19", default-features = false }
serde = "1.0.228"
toml = "0.9.11"
uuid = "1.23.1"
system-interface = "0.27.3"
rfd = "0.17.2"
semver = "1.0.28"
futures-util = "0.3.33"
http = "1.5.0"
async-trait = "0.1.91"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
async-stream = "0.3.6"

[build-dependencies]
slint-build = "1.15.1"
winresource = "0.1.31"
tonic-prost-build = "0.14.6"
